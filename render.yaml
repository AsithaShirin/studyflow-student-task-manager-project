services:
  - type: web
    name: studyflow-student-task-manager
    runtime: node
    buildCommand: npm ci && npm --prefix server ci && npm --prefix client ci && npm --prefix client run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
